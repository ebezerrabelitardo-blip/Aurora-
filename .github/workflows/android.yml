
name: Gerar APK Aurora

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Compilar Aurora para Android
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 15859902

      - name: Verificar ferramentas Android
        run: |
          java -version
          node --version
          sdkmanager --version

      - name: Instalar dependências
        run: npm install @capacitor/core @capacitor/cli @capacitor/android
        working-directory: www
      - name: Preparar arquivos web
        run: |
          mkdir -p dist
          find . -maxdepth 1 -type f \( -name "*.html" -o -name "*.js" -o -name "*.css" -o -name "*.png" -o -name "*.jpg" -o -name "*.json" \) ! -name "package*.json" ! -name "capacitor.config.json" -exec cp {} dist/ \;
        working-directory: www



      - name: Criar projeto Android
        run: npx cap add android
        working-directory: www



      - name: Sincronizar jogo Aurora
        run: npx cap sync android
        working-directory: www

      - name: Compilar APK
        run: ./gradlew assembleDebug
        working-directory: www/android
        
      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Aurora-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
